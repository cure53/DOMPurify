name: Build & Test

# One workflow, always triggered. The "changes" job decides whether code was
# touched; docs-only changes skip the heavy jobs. The "CI" job at the bottom
# is the only job that should be a required status check.

on:
  push:
    branches: [main, 3.x, 2.x]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded PR runs. Pushes to release branches always run to the end.
concurrency:
  group: build-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Runs lint, type checks, fuzzing and the browsers. Keep it on an LTS line.
  PRIMARY_NODE: 24.x

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.detect.outputs.code }}
      os: ${{ steps.detect.outputs.os }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Detect code changes
        id: detect
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          # Files that never affect build or test results.
          docs='\.md$|^demos/|^website/|^LICENSE$|^\.(gitattributes|editorconfig|prettierrc|nvmrc|gitignore)$|^\.husky/|^osv-scanner\.toml$|^\.github/(ISSUE_TEMPLATE\.md|PULL_REQUEST_TEMPLATE\.md|FUNDING\.yml|dependabot\.yml)$|^\.github/workflows/(codeql-analysis|dependency-review|fuzz|scorecard|sign-release|slsa-provenance|legacy-browsers)\.yml$'

          # When in doubt, test: any failure to list files counts as a code change.
          code=true
          files=''
          if [ "$EVENT" = pull_request ]; then
            # HEAD is the merge commit, its first parent is the base branch.
            files=$(git diff --name-only HEAD^1 HEAD) || files=''
          elif [ "$EVENT" = push ] && git fetch --quiet --depth=1 origin "$BEFORE"; then
            files=$(git diff --name-only "$BEFORE" HEAD) || files=''
          fi
          if [ -n "$files" ] && ! printf '%s\n' "$files" | grep -qvE "$docs"; then
            code=false
          fi

          # Pull requests test the browsers on Linux, everything else on all OSes.
          if [ "$EVENT" = pull_request ]; then
            os='["ubuntu-latest"]'
          else
            os='["ubuntu-latest","macos-latest","windows-latest"]'
          fi

          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "os=$os" >> "$GITHUB_OUTPUT"
          echo "code=$code os=$os"

  # Build, dist check and jsdom on every supported Node version. Lint, type
  # checks and a short fuzz run only once, on the primary version.
  install:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x, 24.x, 26.x]

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install Dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      # Checked on every Node version: the committed dist/ is what ships, so
      # it has to be reproducible from src/ no matter which Node builds it.
      - name: Verify dist/ matches src/
        run: |
          if [ -n "$(git status --porcelain dist/)" ]; then
            echo "::error::dist/ is out of sync with src/. Run 'npm run build' and commit the result (the husky pre-commit hook normally does this)."
            git status --short dist/
            git diff dist/ | head -100
            exit 1
          fi
          echo "dist/ matches src/"

      - name: Test (jsdom)
        run: npm run test:jsdom

      - name: Lint
        if: matrix.node-version == env.PRIMARY_NODE
        run: npm run lint

      - name: Verify TypeScript
        if: matrix.node-version == env.PRIMARY_NODE
        run: npm run verify-typescript

      - name: Fuzz (short run)
        if: matrix.node-version == env.PRIMARY_NODE
        run: npm run test:fuzz
        env:
          FUZZ_RUNS: 300

  # Chromium, Firefox and WebKit. Linux only on pull requests; Linux, macOS
  # and Windows on pushes to release branches and on manual runs.
  browsers:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.os) }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js ${{ env.PRIMARY_NODE }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.PRIMARY_NODE }}
          cache: npm

      - name: Install Dependencies
        run: npm ci --ignore-scripts

      - name: Install Playwright Browsers (Linux)
        if: runner.os == 'Linux'
        run: ./node_modules/.bin/playwright install --with-deps chromium firefox webkit

      - name: Install Playwright Browsers (macOS / Windows)
        if: runner.os != 'Linux'
        run: ./node_modules/.bin/playwright install chromium firefox webkit

      - name: Build
        run: npm run build

      - name: Run browser tests (all engines)
        run: npm run test:browser

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.os }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # The one required status check. Green only if every job above passed, or
  # was skipped because no code changed.
  ci:
    name: CI
    if: always()
    needs: [changes, install, browsers]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Check results
        env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          INSTALL: ${{ needs.install.result }}
          BROWSERS: ${{ needs.browsers.result }}
        run: |
          echo "changes=$CHANGES code=$CODE install=$INSTALL browsers=$BROWSERS"
          [ "$CHANGES" = success ] || exit 1
          if [ "$CODE" = false ]; then
            [ "$INSTALL" = skipped ] && [ "$BROWSERS" = skipped ]
          else
            [ "$INSTALL" = success ] && [ "$BROWSERS" = success ]
          fi
