name: SLSA Provenance
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  # Runs the npm toolchain, so it gets a read-only token and no OIDC.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      # No dependency cache on purpose: release builds start clean.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
      - run: npm ci --ignore-scripts
      - run: npm run build
      # The committed dist/ is what gets signed and published. Refuse to
      # attest if the tagged source does not rebuild to exactly those bytes.
      - name: Verify dist/ matches the tagged source
        run: |
          if [ -n "$(git status --porcelain dist/)" ]; then
            echo "::error::dist/ at this tag does not match a clean build of src/."
            git status --short dist/
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: |
            dist/purify.js
            dist/purify.min.js
            dist/purify.cjs.js
            dist/purify.es.mjs
          if-no-files-found: error
          retention-days: 1

  # Holds the write token and OIDC, runs no repository or npm code.
  provenance:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write      # attach the provenance file to the release
      id-token: write      # OIDC for the attestation signature
      attestations: write
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/purify.js,dist/purify.min.js,dist/purify.cjs.js,dist/purify.es.mjs'
      - name: Upload provenance to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          cp "$BUNDLE_PATH" "${TAG}.intoto.jsonl"
          gh release upload "$TAG" "${TAG}.intoto.jsonl" --clobber --repo "$GITHUB_REPOSITORY"
