name: "CodeQL"

on:
  push:
    branches: [main, 3.x, 2.x]
  pull_request:
    # Must match 'push': the ruleset requires CodeQL on all three branches.
    branches: [main, 3.x, 2.x]
  schedule:
    - cron: '0 19 * * 4'

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    permissions:
      actions: read          # read workflow details
      contents: read         # checkout
      security-events: write # upload results
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        # 'javascript' covers TypeScript too. 'actions' scans the workflows
        # in .github/ for injection and permission problems.
        language: ['javascript', 'actions']

    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
      with:
        egress-policy: audit

    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Initialize CodeQL
      uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
      with:
        languages: ${{ matrix.language }}
        build-mode: none

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
